; Reference-compatible renderer options.
; This file is read first, so the in-game/reference FPS selector can update it.
[FPSSystem]
FpsLimit=120

[OpenGL]
VSync=0

[Multiclient]
EnableBackgroundThrottle=1
BackgroundFps=30
MinimizedFps=25
SkipRenderWhenMinimized=1
SafeGpuSyncOnWarp=1

[EffectOptimization]
ParticleBudget=1
CrowdedKundunLOD=1
KundunCrowdThreshold=8
KundunFullFxDistance=550
KundunMidFxDistance=1100