; Restart the client after changing these settings.
; RenderFPS is the display target. Game updates remain at 25 per second.
[Graphics]
; Widescreen UI and HUD size; 100 restores the previous size. Restart required.
UIScalePercent=80
; Valid display targets are 30, 60, and 120. Invalid values use 120.
RenderFPS=120
; 0 keeps original texture detail and lighting, with no world postprocessing.
; 1 enables the optional quality effects below, which can soften fine details.
WorldQuality=0
AntiAliasing=1
Anisotropy=8
SharpenPercent=10
FillLightPercent=12

[Diagnostics]
PerformanceLog=0
